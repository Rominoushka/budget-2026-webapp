<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Token GitHub</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;background:#f4f6fb;color:#101828;padding:18px}input,button{width:100%;font:inherit;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #d0d5dd}button{background:#2563eb;color:white;font-weight:800}pre{white-space:pre-wrap;background:white;border:1px solid #d0d5dd;border-radius:12px;padding:12px}</style></head><body><h1>Test token GitHub</h1><p>Colle ton token et lance le test. Le résultat indiquera si GitHub accepte le token pour ce dépôt.</p><input id="token" type="password" placeholder="github_pat_..."><button id="test">Tester</button><pre id="out">En attente</pre><script>test.onclick=async()=>{out.textContent='Test en cours...';let t=token.value.trim();try{let r=await fetch('https://api.github.com/repos/Rominoushka/budget-2026-webapp/contents/data/vault.json?ref=main',{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});let txt=await r.text();out.textContent='HTTP '+r.status+' '+r.statusText+'\n\n'+txt}catch(e){out.textContent='Erreur navigateur : '+e.message}}</script></body></html>
