<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Budget 2026</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1226;color:white;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.card{width:min(520px,calc(100vw - 32px));background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.35)}h1{font-size:34px;line-height:1;margin:0 0 12px}p{color:#cbd5e1;font-size:16px;line-height:1.45}button{width:100%;height:56px;border:0;border-radius:18px;background:#315efb;color:white;font-size:18px;font-weight:900}</style></head><body><div class="card"><h1>Réinitialisation</h1><p>Nettoyage du cache local et rechargement de la dernière interface Budget 2026.</p><button id="go">Ouvrir la dernière version</button></div><script>async function reset(){try{if('serviceWorker'in navigator){let rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}try{if('caches'in window){let ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}location.replace('./index.html?v=force-'+Date.now())}document.getElementById('go').onclick=reset;setTimeout(reset,800)</script></body></html>
